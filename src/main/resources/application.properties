spring.application.name=corelia-data-service
corelia.service=corelia-data-service
spring.config.import=classpath:corelia-defaults.properties,optional:configtree:/run/secrets/
server.port=${PORT:8443}
server.ssl.enabled=true
server.ssl.key-store=file:${CORELIA_KEY_STORE}
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${corelia.tls.password}
server.ssl.trust-store=file:${CORELIA_TRUST_STORE}
server.ssl.trust-store-type=PKCS12
server.ssl.trust-store-password=${corelia.tls.password}
server.ssl.client-auth=need
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2
server.http2.enabled=true
spring.datasource.url=${CORELIA_DATA_DB_URL:jdbc:postgresql://postgres:5432/corelia_data}
spring.datasource.username=${CORELIA_DATA_DB_USERNAME:corelia_data}
spring.datasource.password=${corelia.data.db.password:}
spring.liquibase.change-log=classpath:db/changelog/data-master.yaml
management.endpoints.web.exposure.include=health,info,metrics
